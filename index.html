
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sanasto – Englanti ja suomi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f6fa;
      color: #202938;
    }
    h1 { color: #2457c5; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccd3df; }
    button {
      background: #2457c5;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    li { margin: 12px 0; }
    .muted { color: #657084; font-size: 14px; }
    #message, #quizMessage { white-space: pre-wrap; }
    .correct { color: #167a43; }
    .wrong { color: #b42318; }
    .word-prompt {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin: 24px 0;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Sanasto</h1>
  <p>Syötä itse englannin- ja suomenkieliset sanaparit ja harjoittele niitä.</p>

  <div class="card">
    <h2>Lisää uusi sana</h2>

    <label for="english">Englanninkielinen sana</label>
    <input id="english" placeholder="Esim. absorbing">

    <label for="finnish">Suomenkielinen vastine</label>
    <input id="finnish" placeholder="Esim. kiehtova">

    <button id="addWord">Lisää sanastoon</button>
    <p id="message" role="status"></p>
  </div>

  <div class="card">
    <h2>Oma sanastosi</h2>
    <p id="wordCount" class="muted"></p>
    <ul id="wordList"></ul>
  </div>

  <div class="card">
    <h2>Sanakoe</h2>
    <p class="muted">Näet suomenkielisen sanan. Kirjoita sen englanninkielinen vastine.</p>

    <button id="startQuiz">Aloita harjoittelu</button>

    <div id="quizArea" class="hidden">
      <p id="progress" class="muted"></p>
      <div id="question" class="word-prompt"></div>
      <input id="answer" placeholder="Kirjoita englanniksi">
      <button id="checkAnswer">Tarkista vastaus</button>
      <p id="quizMessage" role="status"></p>
      <button id="nextQuestion" class="hidden">Seuraava sana</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "sanastoAppWords";

    let words = loadWords();
    let quizWords = [];
    let quizIndex = 0;
    let quizScore = 0;
    let answered = false;

    const englishInput = document.getElementById("english");
    const finnishInput = document.getElementById("finnish");
    const message = document.getElementById("message");
    const wordList = document.getElementById("wordList");
    const wordCount = document.getElementById("wordCount");

    function loadWords() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved.filter(
          w => w && typeof w.english === "string" &&
               typeof w.finnish === "string"
        ) : [];
      } catch {
        return [];
      }
    }

    function saveWords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
    }

    function renderWords() {
      wordList.replaceChildren();
      wordCount.textContent = words.length + " sanaparia";

      words.forEach((word, index) => {
        const item = document.createElement("li");
        item.appendChild(document.createTextNode(
          word.english + " – " + word.finnish + " "
        ));

        const removeButton = document.createElement("button");
        removeButton.textContent = "Poista";
        removeButton.style.width = "auto";
        removeButton.style.padding = "5px 9px";
        removeButton.style.marginLeft = "8px";
        removeButton.addEventListener("click", () => {
          words.splice(index, 1);
          saveWords();
          renderWords();
        });

        item.appendChild(removeButton);
        wordList.appendChild(item);
      });
    }

    document.getElementById("addWord").addEventListener("click", () => {
      const english = englishInput.value.trim();
      const finnish = finnishInput.value.trim();

      if (!english || !finnish) {
        message.textContent = "Täytä molemmat sanakentät.";
        return;
      }

      const duplicate = words.some(w =>
        w.english.toLowerCase() === english.toLowerCase() &&
        w.finnish.toLowerCase() === finnish.toLowerCase()
      );

      if (duplicate) {
        message.textContent = "Tämä sanapari on jo sanastossasi.";
        return;
      }

      words.push({ english, finnish });
      saveWords();
      renderWords();

      englishInput.value = "";
      finnishInput.value = "";
      message.textContent = "Sanapari lisätty!";
      englishInput.focus();
    });

    function showQuestion() {
      if (quizIndex >= quizWords.length) {
        document.getElementById("question").textContent = "Harjoittelu valmis!";
        document.getElementById("progress").textContent =
          "Tulos: " + quizScore + " / " + quizWords.length + " oikein";
        document.getElementById("answer").classList.add("hidden");
        document.getElementById("checkAnswer").classList.add("hidden");
        document.getElementById("nextQuestion").classList.add("hidden");
        document.getElementById("quizMessage").textContent =
          "Voit aloittaa uuden kierroksen painamalla Aloita harjoittelu.";
        return;
      }

      answered = false;
      document.getElementById("progress").textContent =
        "Sana " + (quizIndex + 1) + " / " + quizWords.length;
      document.getElementById("question").textContent =
        quizWords[quizIndex].finnish;
      document.getElementById("answer").value = "";
      document.getElementById("answer").classList.remove("hidden");
      document.getElementById("checkAnswer").classList.remove("hidden");
      document.getElementById("checkAnswer").disabled = false;
      document.getElementById("nextQuestion").classList.add("hidden");
      document.getElementById("quizMessage").textContent = "";
      document.getElementById("answer").focus();
    }

    document.getElementById("startQuiz").addEventListener("click", () => {
      if (words.length === 0) {
        document.getElementById("quizArea").classList.remove("hidden");
        document.getElementById("question").textContent =
          "Lisää ensin sanapareja sanastoon.";
        document.getElementById("progress").textContent = "";
        document.getElementById("answer").classList.add("hidden");
        document.getElementById("checkAnswer").classList.add("hidden");
        document.getElementById("nextQuestion").classList.add("hidden");
        document.getElementById("quizMessage").textContent = "";
        return;
      }

      quizWords = [...words].sort(() => Math.random() - 0.5);
      quizIndex = 0;
      quizScore = 0;
      document.getElementById("quizArea").classList.remove("hidden");
      showQuestion();
    });

    document.getElementById("checkAnswer").addEventListener("click", () => {
      if (answered) return;

      const answer = document.getElementById("answer").value.trim();
      const correct = quizWords[quizIndex].english;

      if (!answer) {
        document.getElementById("quizMessage").textContent =
          "Kirjoita ensin vastaus.";
        return;
      }

      answered = true;
      const result = document.getElementById("quizMessage");

      if (answer.toLowerCase() === correct.toLowerCase()) {
        quizScore++;
        result.textContent = "Oikein!";
        result.className = "correct";
      } else {
        result.textContent = "Ei aivan. Oikea vastaus: " + correct;
        result.className = "wrong";
      }

      document.getElementById("checkAnswer").disabled = true;
      document.getElementById("nextQuestion").classList.remove("hidden");
      document.getElementById("nextQuestion").textContent =
        quizIndex === quizWords.length - 1 ? "Näytä tulos" : "Seuraava sana";
    });

    document.getElementById("nextQuestion").addEventListener("click", () => {
      quizIndex++;
      showQuestion();
    });

    document.getElementById("answer").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        if (answered) {
          document.getElementById("nextQuestion").click();
        } else {
          document.getElementById("checkAnswer").click();
        }
      }
    });

    renderWords();
  </script>
</body>
</html>
