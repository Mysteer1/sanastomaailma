  <style>

    body {

      border-radius: 12px;
      margin: 20px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    label {
      display: block;
      font-size: 14px;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
      color: #202938;
    }

    input:focus {
      outline: 2px solid #9bb8ff;
      border-color: #2457c5;
    }

    button {
      display: block;
      width: 100%;
      padding: 12px 16px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #2457c5;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1946a5;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary-button {
      background: #657084;

      background: #4b5565;
    }

    .muted {
      color: #657084;

    }

    .status {
      min-height: 20px;
      overflow-wrap: anywhere;
    }

    .correct {
      color: #167a43;
      font-weight: bold;
    }

    .wrong {
      color: #b42318;
      font-weight: bold;
    }

    .word-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .word-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #edf0f5;
      overflow-wrap: anywhere;
    }

    .word-list li:last-child {
      border-bottom: none;
    }

    .word-pair {
      flex: 1;
      min-width: 0;
    }

    .delete-button {
      display: inline-block;
      flex: 0 0 auto;
      width: auto;
      margin: 0;
      padding: 7px 10px;
      font-size: 13px;
      background: #b42318;
    }

    .delete-button:hover {
      background: #8f1c13;
    }

    .word-prompt {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      overflow-wrap: anywhere;
      margin: 28px 0;
    }

    .progress-track {
      height: 8px;
      background: #e5eaf2;
      border-radius: 10px;
      overflow: hidden;
      margin: 12px 0 20px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: #2457c5;
      transition: width 0.2s ease;
    }

    .hidden {
      display: none !important;
    }

    .result-score {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }

    @media (max-width: 480px) {
      body {
        margin: 10px auto;
        padding: 12px;
      }

      .card {
        padding: 17px;
      }

      .word-prompt {
        font-size: 28px;
      }
    }
  </style>
</head>
